<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Thesis — Faris Capital</title>
    <meta id="meta-description" name="description" content="Investment Thesis from Faris Capital.">
    <link rel="stylesheet" href="css/style.css?v=23">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header></header>

    <main>
        <!-- Header spacer to push content below sticky nav -->
        <div style="height: var(--header-height);"></div>

        <section class="section container">
            <div style="margin-bottom: 2rem;">
                <a href="investment-theses.html" style="font-size: 0.95rem; font-weight: 600; text-decoration: none; color: var(--accent-color); display: inline-flex; align-items: center; gap: 0.5rem; transition: transform 0.2s;" onmouseover="this.style.transform='translateX(-4px)'" onmouseout="this.style.transform='translateX(0)'">
                    <span>←</span> Back to Investment Theses
                </a>
            </div>

            <article style="max-width: 760px; margin: 0 auto; padding: 1rem 0 4rem 0;">
                <div id="article-date" style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-gold); font-weight: 600; margin-bottom: 1rem;"></div>

                <h1 id="article-title" style="font-size: clamp(2rem, 5vw, 3rem); line-height: 1.2; margin-bottom: 1.5rem; color: var(--text-primary); font-family: var(--font-heading); font-weight: 700;"></h1>

                <div id="article-teaser" style="font-size: 1.25rem; line-height: 1.6; font-weight: 400; color: var(--text-secondary); margin-bottom: 2.5rem; padding-left: 1.25rem; border-left: 3px solid var(--accent-gold); font-family: var(--font-body);"></div>

                <div id="article-body" style="font-size: 1.05rem; line-height: 1.8; color: var(--text-primary); margin-bottom: 3.5rem; font-family: var(--font-body); font-weight: 300;">
                    <!-- Content will be injected here -->
                </div>

                <div id="article-linkedin-link" style="border-top: 1px solid var(--border-color); padding-top: 2rem; margin-top: 3rem; display: flex; flex-direction: column; gap: 1rem;">
                    <p style="font-size: 0.95rem; color: var(--text-secondary); margin: 0; font-family: var(--font-body); font-weight: 300;">This thesis was originally published on LinkedIn. Join the discussion, add your thoughts, and follow for regular updates.</p>
                    <a id="linkedin-btn" href="#" target="_blank" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 0.5rem; align-self: flex-start; padding: 0.75rem 1.5rem; font-size: 0.8rem; font-weight: 600;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: inline-block; vertical-align: middle;"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                        View on LinkedIn
                    </a>
                </div>
            </article>
        </section>
    </main>

    <footer></footer>

    <script src="js/components.js?v=23"></script>
    <script src="js/investment-theses-data.js?v=23"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Get article ID from query parameters
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id || typeof INVESTMENT_THESES === 'undefined') {
                window.location.href = 'investment-theses.html';
                return;
            }

            // Find matching article
            const article = INVESTMENT_THESES.find(p => p.id === id);

            if (!article) {
                // If not found, redirect back
                window.location.href = 'investment-theses.html';
                return;
            }

            // Populate page content
            document.title = `${article.title} — Faris Capital`;

            const metaDescription = document.getElementById('meta-description');
            if (metaDescription) {
                metaDescription.setAttribute('content', article.teaser || `Investment Thesis from Faris Capital: ${article.title}`);
            }

            document.getElementById('article-date').innerText = article.date || '';
            document.getElementById('article-title').innerText = article.title || '';
            document.getElementById('article-teaser').innerText = article.teaser || '';
            document.getElementById('article-body').innerHTML = article.content || '';

            // Setup LinkedIn link button
            const linkedinBtn = document.getElementById('linkedin-btn');
            if (linkedinBtn) {
                if (article.linkedinUrl) {
                    linkedinBtn.setAttribute('href', article.linkedinUrl);
                } else {
                    // Hide the section if no URL is provided
                    document.getElementById('article-linkedin-link').style.display = 'none';
                }
            }
        });
    </script>
    <script src="js/main.js?v=23"></script>
</body>

</html>
