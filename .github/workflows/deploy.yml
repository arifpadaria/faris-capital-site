name: Validate and deploy Firebase Hosting
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: faris-production
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate publisher and output
        run: node --test scripts/*.test.js
      - name: Verify generated pages match reviewed source
        run: |
          node scripts/generate-thesis-pages.js
          git diff --exit-code -- js/investment-theses-data.js theses sitemap.xml
      - name: Build public files only
        run: node scripts/build-public.js
      - name: Authenticate to Google Cloud (Workload Identity Federation, no key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/972742112794/locations/global/workloadIdentityPools/github-actions/providers/github-repo
          service_account: github-actions-deploy@faris-capital-web-6f0dc.iam.gserviceaccount.com
      - name: Install pinned Firebase CLI
        run: npm install -g firebase-tools@15.30.2
      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project faris-capital-web-6f0dc
