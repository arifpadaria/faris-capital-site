name: Validate and deploy Firebase Hosting
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: faris-production
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate publisher and output
        run: node --test scripts/*.test.js
      - name: Verify generated pages match reviewed source
        run: |
          node scripts/generate-thesis-pages.js
          git diff --exit-code -- js/investment-theses-data.js theses sitemap.xml
      - name: Build public files only
        run: node scripts/build-public.js
      - name: Install pinned Firebase CLI
        run: npm install -g firebase-tools@15.29.0
      - name: Deploy Firebase Hosting
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only hosting --project faris-capital-web-6f0dc
          rm -f "$RUNNER_TEMP/sa.json"
