name: Deploy to Firebase Hosting on Merge
on:
  push:
    branches:
      - main

# Forces the system to run on modern infrastructure and silences deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js & Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firebase Tools Globally
        run: npm install -g firebase-tools

      - name: Deploy Live to Firebase Hosting
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project faris-capital-web-6f0dc