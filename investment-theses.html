<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Theses — Faris Capital</title>
    <meta name="description" content="Strategic investment theses on venture scale, AI, and institutional capital. Frameworks from Faris Capital.">
    <link rel="canonical" href="https://faris-capital.com/investment-theses.html">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Faris Capital">
    <meta property="og:title" content="Investment Theses — Faris Capital">
    <meta property="og:description" content="Strategic investment theses on venture scale, AI, and institutional capital. Frameworks from Faris Capital.">
    <meta property="og:url" content="https://faris-capital.com/investment-theses.html">
    <meta property="og:image" content="https://faris-capital.com/images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Investment Theses — Faris Capital">
    <meta name="twitter:description" content="Strategic investment theses on venture scale, AI, and institutional capital. Frameworks from Faris Capital.">
    <meta name="twitter:image" content="https://faris-capital.com/images/og-image.png">
    <link rel="stylesheet" href="css/style.css?v=34">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header></header>

    <main>
        <section class="section hero container" style="padding-bottom: 24px;">
            <h1 class="hero-heading">Investment Theses</h1>
            <p style="font-size: 1.25rem; font-weight: 500; margin-top: 0.75rem;">Strategic frameworks on venture scale, capital alignment, and where value forms in technology at global scale.</p>
        </section>

        <section class="section container" style="padding-top: 8px;">
            <div id="theses-grid" class="grid grid-3">
                <!-- Loaded dynamically from js/investment-theses-data.js -->
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="js/components.js?v=34"></script>
    <script src="js/investment-theses-data.js?v=34"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('theses-grid');
            if (grid && typeof INVESTMENT_THESES !== 'undefined') {
                grid.innerHTML = INVESTMENT_THESES.map(p => `
                    <div class="content-block radius-card" style="border: 1px solid var(--border-color); padding: 2rem; display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                        <div>
                            <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 0.75rem;">${p.date}</div>
                            <h3 style="font-size: 1.25rem; line-height: 1.4; margin-bottom: 1rem; color: var(--text-primary); font-family: var(--font-heading); font-weight: 600;">${p.title}</h3>
                            <p style="font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem;">${p.teaser}</p>
                        </div>
                        <a href="theses/${p.id}.html" class="accent-link" style="font-size: 0.9rem; font-weight: 600; text-decoration: none; color: var(--accent-color); display: inline-flex; align-items: center; gap: 0.25rem; margin-top: auto;">
                            Read Thesis <span style="transition: transform 0.2s;">→</span>
                        </a>
                    </div>
                `).join('');
            }
        });
    </script>
    <script src="js/main.js?v=34"></script>
</body>

</html>
