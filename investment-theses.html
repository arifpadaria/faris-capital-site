<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Theses — Faris Capital</title>
    <meta name="description" content="Strategic investment theses on venture scale, AI, and institutional capital. Frameworks from Faris Capital.">
    <link rel="stylesheet" href="css/style.css?v=20">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header></header>

    <main>
        <section class="section hero container">
            <h2>Investment Theses</h2>
            <p style="font-size: 1.25rem; font-weight: 500;">Strategic frameworks on venture scale, capital alignment, and where value forms in technology at global scale.</p>
        </section>

        <section class="section container">
            <div id="theses-grid" class="grid grid-3">
                <!-- Loaded dynamically from js/investment-theses-data.js -->
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="js/components.js?v=21"></script>
    <script src="js/investment-theses-data.js?v=21"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('theses-grid');
            if (grid && typeof INVESTMENT_THESES !== 'undefined') {
                grid.innerHTML = INVESTMENT_THESES.map(p => `
                    <div class="content-block radius-card" style="border: 1px solid var(--border-color); padding: 2rem; display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                        <div>
                            <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 0.75rem;">${p.date}</div>
                            <h3 style="font-size: 1.25rem; line-height: 1.4; margin-bottom: 1rem; color: var(--text-primary); font-family: var(--font-heading); font-weight: 600;">${p.title}</h3>
                            <p style="font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem;">${p.teaser}</p>
                        </div>
                        <a href="article.html?id=${p.id}" class="accent-link" style="font-size: 0.9rem; font-weight: 600; text-decoration: none; color: var(--accent-color); display: inline-flex; align-items: center; gap: 0.25rem; margin-top: auto;">
                            Read Thesis <span style="transition: transform 0.2s;">→</span>
                        </a>
                    </div>
                `).join('');
            }
        });
    </script>
    <script src="js/main.js?v=21"></script>
</body>

</html>
