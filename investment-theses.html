    <meta property="og:site_name" content="Faris Capital">

</head>

<body>

    <header></header>

    <main>
        <section class="section hero container" style="padding-bottom: 24px;">
            <h1 class="hero-heading">Perspectives</h1>
            <p style="font-size: 1.25rem; font-weight: 500; margin-top: 0.75rem;">Writing on Physical AI, agentic infrastructure, AI governance, and venture strategy — originally published on LinkedIn.</p>
        </section>

        <section class="section container" style="padding-top: 8px;">
            <div id="theme-filters" style="display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 2rem;"></div>
            <div id="theses-grid" class="grid grid-3">
                <!-- Loaded dynamically from js/investment-theses-data.js -->
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="js/components.js?v=37"></script>
    <script src="js/investment-theses-data.js?v=37"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('theses-grid');
            const filters = document.getElementById('theme-filters');
            if (!grid || typeof INVESTMENT_THESES === 'undefined') return;

            const pillStyle = (active) => `
                font-size: 0.85rem; font-weight: 600; padding: 0.5rem 1.1rem; border-radius: 999px;
                border: 1px solid ${active ? 'var(--accent-color)' : 'var(--border-color)'};
                background: ${active ? 'var(--accent-color)' : 'transparent'};
                color: ${active ? '#fff' : 'var(--text-secondary)'};
                cursor: pointer; transition: all 0.2s;
            `;

            let activeTheme = 'all';

            function renderFilters() {
                const themeKeys = Object.keys(THEMES).filter(k => INVESTMENT_THESES.some(p => p.theme === k));
                const all = [{ key: 'all', label: 'All Perspectives' }, ...themeKeys.map(k => ({ key: k, label: THEMES[k].label }))];
                filters.innerHTML = all.map(t => `<button type="button" data-theme="${t.key}" style="${pillStyle(t.key === activeTheme)}">${t.label}</button>`).join('');
                filters.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        activeTheme = btn.getAttribute('data-theme');
                        renderFilters();
                        renderGrid();
                    });
                });
            }

            function renderGrid() {
                const posts = activeTheme === 'all' ? INVESTMENT_THESES : INVESTMENT_THESES.filter(p => p.theme === activeTheme);
                grid.innerHTML = posts.map(p => `
                    <div class="content-block radius-card" style="border: 1px solid var(--border-color); padding: 2rem; display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; margin-bottom: 0.75rem;">
                                <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary);">${p.date}</div>
                                ${p.theme && THEMES[p.theme] ? `<div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-color); font-weight: 600; white-space: nowrap;">${THEMES[p.theme].label}</div>` : ''}
                            </div>
                            <h3 style="font-size: 1.25rem; line-height: 1.4; margin-bottom: 1rem; color: var(--text-primary); font-family: var(--font-heading); font-weight: 600;">${p.title}</h3>
                            <p style="font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem;">${p.teaser}</p>
                        </div>
                        <a href="theses/${p.id}.html" class="accent-link" style="font-size: 0.9rem; font-weight: 600; text-decoration: none; color: var(--accent-color); display: inline-flex; align-items: center; gap: 0.25rem; margin-top: auto;">
                            Read Perspective <span style="transition: transform 0.2s;">→</span>
                        </a>
                    </div>
                `).join('');
            }

            renderFilters();
            renderGrid();
        });
    </script>
    <script src="js/main.js?v=37"></script>
</body>

</html>
