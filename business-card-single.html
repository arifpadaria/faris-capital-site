<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faris Capital — Business Card (Single Side)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #F1F5F9;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 48px;
      padding: 48px 24px;
    }

    .label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 12px;
      text-align: center;
    }

    .card {
      width: 672px;
      height: 384px;
      border-radius: 6px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      flex-shrink: 0;
    }

    /* ── NAVY VERSION ── */
    .card-navy {
      background: #0F2A5F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px;
    }

    .card-navy .logo {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #F8FAFC;
      margin-bottom: 18px;
      text-align: center;
    }

    .card-navy .gold-rule {
      width: 36px;
      height: 1px;
      background: #C5A059;
      margin: 0 auto 18px;
    }

    .card-navy .name {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .card-navy .title {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 20px;
    }

    .card-navy .divider {
      width: 36px;
      height: 1px;
      background: rgba(197,160,89,0.4);
      margin: 0 auto 18px;
    }

    .card-navy .contact {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-navy .contact a {
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 400;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      line-height: 1.6;
    }

    .card-navy .contact .website {
      color: #C5A059;
    }


    @media print {
      body { background: white; gap: 0; padding: 0; }
      .label { display: none; }
      .card { box-shadow: none; border: 0.5pt solid #ccc; page-break-after: always; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <div>
    <p class="label">Faris Capital — Business Card</p>
    <div class="card card-navy">
      <div class="logo">FARIS CAPITAL</div>
      <div class="gold-rule"></div>
      <div class="name">Arif Padaria</div>
      <div class="title">Founder, Faris Capital</div>
      <div class="divider"></div>
      <div class="contact">
        <a href="mailto:arif@faris-capital.com">arif@faris-capital.com</a>
        <a href="tel:+16179030786">+1.617.903.0786</a>
        <a class="website" href="https://faris-capital.com">faris-capital.com</a>
      </div>
    </div>
  </div>


</body>
</html>
